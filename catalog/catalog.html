<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maison Aris — Catalog</title>


    <!-- GLOBAL CSS -->

    <link
        rel="stylesheet"
        href="../css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="../css/footer.css"
    >


    <!-- CATALOG CSS -->

    <link
        rel="stylesheet"
        href="catalog.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <div id="navbar"></div>


    <!-- CATALOG -->

    <main id="catalog">

        <!-- CATALOG HEADER -->

        <section class="catalog-header">

            <div class="catalog-heading">

                <p class="catalog-label">
                    MAISON ARIS
                </p>

                <h1 id="catalog-title">
                    CATALOG
                </h1>

            </div>


            <div class="catalog-controls">

                <button>FILTER</button>
                <button>SORT</button>

            </div>

        </section>


        <!-- PRODUCT GRID -->

        <section id="product-grid">

            <!-- Products generated by catalog.js -->

        </section>

    </main>


    <!-- COMPONENT LOADER -->

    <script src="../js/components.js"></script>

    <!-- CATALOG JS -->

    <script src="catalog.js"></script>


</body>

</html>
