<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&A</title>


    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="stylesheet" href="css/navbar.css" type="text/css">
    <link rel="stylesheet" href="css/footer.css" type="text/css">
    <link rel="stylesheet" href="css/page-transition.css" type="text/css">


    <!-- FONTS I WILL BE USING -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2&f[]=cabinet-grotesk@1&f[]=chillax@1&f[]=stardom@400&f[]=supreme@1,2&f[]=boska@1,2&f[]=telma@1&f[]=dancing-script@1&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ICONS LINK -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Yesteryear&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar Component -->
    <div id="navbar"></div>

    <!-- SCROLL CONTAINER FOR SNAP SCROLLING -->
    <div class="scroll-container">

        <!-- HERO SECTION -->
        <section id="hero" class="snap-section">
            <video src="media/video/main.mp4" autoplay loop muted height="100%" width="100%"></video>
            <div id="velvet_btn">
                <p class="bold">VELVET HEAT</p>
                <p>DISCOVER</p>
            </div>
        </section>

        <!-- CATEGORIES SECTION -->
        <section id="categories" class="snap-section">
            <div class="category_images" id="category_handbags">
                <div id="category_handbags_image"></div>
                <div id="category_handbags_name">
                    <p class="bold">HANDBAGS</p>
                    <p>EXPLORE</p>
                </div>
            </div>
            <div class="category_images" id="category_lingerie">
                <div id="category_lingerie_image"></div>
                <div id="category_lingerie_name">
                    <p class="bold">SHADES OF SUMMER</p>
                    <p>VIEW MORE</p>
                </div>
            </div>
        </section>

        <!-- ADD MORE SECTIONS HERE IF NEEDED -->
        <section id="womens_section" class="snap-section">
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; font-family: 'satoshi', sans-serif; font-size: 3rem; color: #313131;">
                <img src="media/image/women_section_thumbnail.png" width="100%" alt="">
                <div id="velvet_btn">
                    <p class="bold">WOMENS CLOTHING</p>
                    <p>DISCOVER</p>
                </div>
            </div>
        </section>

        <section id="mens_section" class="snap-section">
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; font-family: 'satoshi', sans-serif; font-size: 3rem; color: #313131;">
                <img src="media/image/men_section_thumbnail.png" width="100%" alt="">
                <div id="velvet_btn">
                <p class="bold">MENS CLOTHING</p>
                <p>DISCOVER</p>
            </div> 
            </div>
        </section>

        <section id="production_video_page" class="snap-section">
            <video src="media/video/maisonAris_production3.mp4" autoplay loop muted height="10%" width="100%"></video>
        </section>
        
        <!-- Footer Component -->
        <div id="footer"></div>
    </div>

    
    <script src ="js/components.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

    <script src="js/page-transition.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
